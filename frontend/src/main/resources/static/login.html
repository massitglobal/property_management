<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center p-3">

<main class="login-card card shadow-sm border-0">
    <div class="card-body p-4 p-md-5">
        <h1 class="h4 fw-semibold mb-1">Sign in</h1>
        <p class="text-body-secondary mb-4">Enter your credentials to continue.</p>

        <div id="alert" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">Email or username</label>
                <input type="text" class="form-control" id="username" autocomplete="username" required autofocus>
                <div class="invalid-feedback">Enter your email or username.</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group has-validation">
                    <input type="password" class="form-control" id="password" autocomplete="current-password" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password">
                        <i class="bi bi-eye"></i>
                    </button>
                    <div class="invalid-feedback">Enter your password.</div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <a href="#" class="small">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                <span class="spinner-border spinner-border-sm me-2 d-none" id="spinner" aria-hidden="true"></span>
                Sign in
            </button>
        </form>
    </div>
</main>

<!--js script dekat sini-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/login.js"></script>

</body>
</html>
