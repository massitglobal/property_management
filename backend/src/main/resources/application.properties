spring.application.name=backend

server.port=8080


spring.datasource.url=jdbc:mariadb://localhost:3306/assesment
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

#jwt section
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}


#data init
app.seed.admin-password=${SEED_ADMIN_PASSWORD:admin}
app.seed.user-password=${SEED_USER_PASSWORD:user}